services:
  postgres:
    image: postgres:16-alpine
    container_name: kitchen-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrator:
    build:
      context: .
      dockerfile: deployments/migrator.Dockerfile
    container_name: kitchen-migrator
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      GOOSE_MIGRATION_DIR: /migrations
    command: ["up"]
    restart: "no"

  platform:
    build:
      context: .
      dockerfile: deployments/platform.Dockerfile
    container_name: kitchen-platform
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      LOG_LEVEL: debug
      HTTP_PORT: "8080"
      SHUTDOWN_TIMEOUT: 10s
      POSTGRES_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "${PLATFORM_HTTP_PORT}:8080"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/healthz" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: